<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Road Community Church — MERGE Youth Group Sunday Meal Sign-Ups</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/merge-icon-192.png">
  <link rel="manifest" href="merge-manifest.webmanifest">
  <meta name="theme-color" content="#eaeaea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MERGE Meals">
  <style>
    :root {
      --bg: #eaeaea;
      --surface: #f5f5f5;
      --card: #ffffff;
      --ink: #222222;
      --muted: #555555;
      --primary: #a63e14;
      --primary-ink: #ffffff;
      --open: #187151;
      --taken: #a63e14;
      --border: #dddddd;
      --ring: #e75f28
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px
    }

    .app-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px
    }

    .app-actions a {
      font-weight: 700
    }

    .install-help {
      width: 100%;
      margin: 0;
      text-align: right
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 10px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .card.claimed {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 35%, transparent)
    }

    .date {
      font-weight: 800
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: var(--primary);
      color: var(--primary-ink);
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer
    }

    .btn[disabled] {
      opacity: .6;
      cursor: not-allowed
    }

    .btn[hidden] {
      display: none
    }

    .btn:hover {
      filter: brightness(.97)
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800
    }

    .pill-open {
      background: var(--open);
      color: #fff
    }

    .pill-taken {
      background: var(--taken);
      color: #fff
    }

    .meta {
      color: var(--muted);
      font-size: 13px
    }

    .claimed-by {
      display: none;
      align-items: center;
      gap: 6px
    }

    .card.claimed .claimed-by {
      display: flex
    }

    .err {
      color: #b91c1c;
      margin-top: 6px
    }

    .signup-footer {
      margin: 28px 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center
    }

    .skel {
      background: var(--surface);
      height: 16px;
      border-radius: 6px;
      animation: pulse 1.2s infinite ease-in-out
    }

    @keyframes pulse {
      0% {
        opacity: .6
      }

      50% {
        opacity: 1
      }

      100% {
        opacity: .6
      }
    }
  </style>
  <link rel="stylesheet" href="site.css">

  <script>
    let installPrompt = null;
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
    });

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm--s3Aa2t9gWW07J8bU4ACvU9bozMeA4C4iKV-XUyLvu2E-FSqA4THg-l1TtrFns6Wg/exec";
    function loadSignups() {
      return new Promise((resolve, reject) => {
        const cb = 'cb_' + Math.random().toString(36).slice(2);
        const s = document.createElement('script');
        const timer = setTimeout(() => fail(new Error('Signup request timed out')), 15000);
        function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
        function fail(error) { cleanup(); reject(error); }
        window[cb] = data => {
          cleanup();
          if (!Array.isArray(data) || !data.every(row => row &&
              typeof row.date_iso === 'string' && typeof row.first_name === 'string')) {
            reject(new Error('Unexpected signup data'));
            return;
          }
          resolve(data);
        };
        s.src = SCRIPT_URL + '?action=list&callback=' + cb + '&_ts=' + Date.now();
        s.onerror = () => fail(new Error('Signup request failed'));
        document.head.appendChild(s);
      });
    }

    const signupsP = loadSignups();
    // Dynamically generate all Sundays from 2025-09-07 to 2027-12-26
    const DATES = (() => {
      const start = new Date("2025-09-07T00:00:00");
      const end = new Date("2027-12-26T00:00:00");
      const arr = [];
      let d = new Date(start);
      while (d <= end) {
        const iso = d.toISOString().slice(0, 10);
        const nice = d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        arr.push({ iso, nice });
        d.setDate(d.getDate() + 7);
      }
      return arr;
    })();
  </script>

</head>

<body>
  <main class="container">
    <div class="app-actions">
      <a href="https://www.theroadcommunitychurch.com/">Church Website</a>
      <button class="btn" type="button" id="install-app" aria-describedby="install-help">Install app</button>
      <p id="install-help" class="meta install-help" role="status" aria-live="polite"></p>
    </div>
    <header class="header page-intro">
      <h1>MERGE Youth Group — Sunday Meal Sign-Ups</h1>
      <p>Sign up to provide a Sunday meal for the youth group. To change or cancel a signup, use the private link in your confirmation email.</p>
      <p>Select an available Sunday to sign up.</p>
      <div id="err" class="err"></div>
      <div id="debug" class="meta"></div>
    </header>

    <section id="grid" class="grid">
      <div class="card">
        <div class="skel" style="width:40%"></div>
        <div class="skel" style="width:70%"></div>
      </div>
      <div class="card">
        <div class="skel" style="width:50%"></div>
        <div class="skel" style="width:60%"></div>
      </div>
      <div class="card">
        <div class="skel" style="width:35%"></div>
        <div class="skel" style="width:65%"></div>
      </div>
    </section>

    <footer class="signup-footer">
      The Road Community Church • MERGE Youth Group
    </footer>
  </main>

  <script>
    const installButton = document.getElementById('install-app');
    const installHelp = document.getElementById('install-help');
    const installedDisplay = window.matchMedia('(display-mode: standalone)');
    function updateInstallButton() {
      installButton.hidden = installedDisplay.matches || window.navigator.standalone === true;
    }
    updateInstallButton();
    window.addEventListener('appinstalled', () => {
      installPrompt = null;
      installButton.hidden = true;
      installHelp.textContent = 'App installed.';
    });
    installButton.addEventListener('click', async () => {
      if (installPrompt) {
        const prompt = installPrompt;
        installPrompt = null;
        try {
          await prompt.prompt();
          const choice = await prompt.userChoice;
          if (choice.outcome === 'dismissed') {
            installHelp.textContent = 'Installation canceled. You can try again from your browser menu.';
          }
        } catch (error) {
          console.error(error);
          installHelp.textContent = 'Unable to open the install prompt. Try your browser menu instead.';
        }
      } else if (/iPad|iPhone|iPod/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        installHelp.textContent = 'In Safari, tap Share, then Add to Home Screen.';
      } else {
        installHelp.textContent = 'Open your browser menu and look for Install app or Add to Home screen. If unavailable, try a supported browser.';
      }
    });

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function cardHTML(d, takenName) {
      const iso = d.iso;
      const nice = escapeHTML(d.nice);
      const isTaken = takenName !== undefined;
      return `
    <article class="card ${isTaken ? 'claimed' : ''}" data-iso="${iso}" aria-labelledby="d-${iso}">
      <div id="d-${iso}" class="date">${nice}</div>
      <div class="status" data-openrow="${iso}" style="${isTaken ? 'display:none' : ''}">
        <span class="pill pill-open" data-pill="${iso}">OPEN</span>
        <span class="meta" data-status="${iso}">Available</span>
      </div>
      <div class="claimed-by" data-claimed="${iso}" style="${isTaken ? 'display:flex' : 'display:none'}">
        <span class="pill pill-taken">TAKEN</span>
        <span class="meta">Taken by <strong data-who="${iso}">${escapeHTML(takenName || '')}</strong></span>
      </div>
      ${isTaken ? '' : `<a class="btn signup-link" href="${SCRIPT_URL}?date=${encodeURIComponent(iso)}" aria-label="Sign up for ${nice}">Sign up</a>`}
    </article>
  `;
    }

    function setError(msg) {
      const err = document.getElementById('err');
      if (err) err.textContent = msg || '';
    }

    function renderGrid(signups) {
      const byDate = new Map(signups.map(r => [r.date_iso.slice(0, 10), r.first_name]));
      // Find upcoming Sunday (including today if today is Sunday)
      const today = new Date();
      const nextSunday = new Date(today);
      const offset = (7 - today.getDay()) % 7; // 0 if Sunday, else days until Sunday
      nextSunday.setDate(today.getDate() + offset);
      nextSunday.setHours(0, 0, 0, 0);

      // Only show dates starting from upcoming Sunday
      const upcomingDates = DATES.filter(d => {
        const di = new Date(d.iso + 'T00:00:00');
        di.setHours(0, 0, 0, 0);
        return di.getTime() >= nextSunday.getTime();
      });

      const html = upcomingDates.map(d => cardHTML(d, byDate.get(d.iso))).join('');
      const grid = document.getElementById('grid');
      grid.innerHTML = html;
      const dbg = document.getElementById('debug');
      if (dbg) dbg.textContent = 'Loaded ' + (signups ? signups.length : 0) + ' signup(s) • Starting from ' + nextSunday.toLocaleDateString() + ' • ' + new Date().toLocaleTimeString();
    }

    let requestNumber = 0;
    function showSignups(request) {
      const currentRequest = ++requestNumber;
      request.then(signups => {
        if (currentRequest !== requestNumber) return;
        setError('');
        renderGrid(signups);
      }).catch(err => {
        if (currentRequest !== requestNumber) return;
        console.error(err);
        document.getElementById('grid').textContent = '';
        document.getElementById('debug').textContent = '';
        setError('Cannot load availability. Please reload this page.');
      });
    }
    showSignups(signupsP);
    let popupTimer;
    document.getElementById('grid').addEventListener('click', event => {
      const link = event.target.closest('a.signup-link');
      if (!link || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      const popup = window.open(link.href, 'merge-signup', 'popup,width=600,height=800');
      if (!popup) return;
      event.preventDefault();
      popup.focus();
      clearInterval(popupTimer);
      popupTimer = setInterval(() => {
        if (popup.closed) {
          clearInterval(popupTimer);
          showSignups(loadSignups());
        }
      }, 1000);
    });
    window.addEventListener('pageshow', event => {
      if (event.persisted) showSignups(loadSignups());
    });
  </script>

</body>

</html>
